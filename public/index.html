<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Rollcall.ai · Payroll Assurance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Rollcall.ai Payroll Assurance checks every pay cycle from WFM time through the payroll register, treasury funding and GL posting, and gates payroll release on the results. Everyone Accounted For.">
<link rel="icon" type="image/png" href="brand/favicon-64.png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: product shell. Dark sidebar for navigation, sticky top bar for the active pay
   cycle and the release gate, pages for overview, the exception queue (list + detail),
   people, controls, data sources, rules, reports and the activity log. */
:root {
  /* Rollcall.ai brand (Branding Guide). Primary: Vivid Blue, Vivid Pink, Sunrise Orange.
     Secondary: Cloud Blue, Midnight. Type: Sora (display) and Manrope (text). */
  --rc-blue: #3653fd;
  --rc-pink: #fd328e;
  --rc-orange: #fe812b;
  --rc-cloud: #e5ecf9;
  --rc-midnight: #001137;
  --brand-gradient: linear-gradient(100deg, #3653fd 0%, #9b3cf4 38%, #fd328e 68%, #fe812b 100%);
  --brand: var(--rc-blue);
  --brand-ink: #ffffff;
  --brand-soft: var(--rc-cloud);

  --bg: #f4f7fd;
  --surface: #ffffff;
  --surface-2: #eef2fa;
  --ink: #0b1530;
  --ink-2: #33405e;
  --muted: #5d6b8a;
  --line: #dde4f1;
  --line-strong: #b7c3dc;
  --accent: var(--brand);
  --accent-ink: var(--brand-ink);
  --accent-soft: var(--brand-soft);
  --side: var(--rc-midnight);
  --side-2: #0c2152;
  --side-ink: #c9d4ee;
  --side-muted: #8d9ccc;
  --side-active: #ffffff;
  --crit: #d92d20;
  --crit-soft: #fde8e6;
  --warn: #b54708;
  --warn-soft: #fdf0dc;
  --ok: #067647;
  --ok-soft: #e3f5ea;
  --info: #3653fd;
  --info-soft: #e5ecf9;
  --cc-prior: #8592b0;
  --hatch: rgba(11, 21, 48, 0.06);
  --shadow: 0 1px 2px rgba(0, 17, 55, 0.06), 0 12px 32px rgba(0, 17, 55, 0.10);
  --scrim: rgba(0, 10, 35, 0.45);

  --f-display: "Sora", "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --t-2xs: 0.6875rem;
  --t-xs: 0.75rem;
  --t-sm: 0.8125rem;
  --t-md: 0.875rem;
  --t-lg: 1rem;
  --t-xl: 1.25rem;
  --t-2xl: 1.625rem;
  --t-3xl: 2.125rem;
  --r: 10px;
  --r-sm: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #7d93ff; --brand-ink: #04102e; --brand-soft: #16285a;
    --bg: #000b26; --surface: #061636; --surface-2: #0c2047; --ink: #e6ecfa; --ink-2: #b9c5e0; --muted: #93a3c4;
    --line: #17295a; --line-strong: #2c4178;
    --side: #00081e; --side-2: #0c1d48; --side-ink: #c9d4ee; --side-muted: #8d9ccc; --side-active: #ffffff;
    --crit: #ff7b72; --crit-soft: #3a1418; --warn: #f5b041; --warn-soft: #33240b; --ok: #4cc38a; --ok-soft: #0b2c22;
    --info: #9db0ff; --info-soft: #14254f; --hatch: rgba(230, 236, 250, 0.05); --cc-prior: #5a6ea6;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 32px rgba(0, 0, 0, 0.35); --scrim: rgba(0, 4, 18, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: #7d93ff; --brand-ink: #04102e; --brand-soft: #16285a;
  --bg: #000b26; --surface: #061636; --surface-2: #0c2047; --ink: #e6ecfa; --ink-2: #b9c5e0; --muted: #93a3c4;
  --line: #17295a; --line-strong: #2c4178;
  --side: #00081e; --side-2: #0c1d48; --side-ink: #c9d4ee; --side-muted: #8d9ccc; --side-active: #ffffff;
  --crit: #ff7b72; --crit-soft: #3a1418; --warn: #f5b041; --warn-soft: #33240b; --ok: #4cc38a; --ok-soft: #0b2c22;
  --info: #9db0ff; --info-soft: #14254f; --hatch: rgba(230, 236, 250, 0.05); --cc-prior: #5a6ea6;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 32px rgba(0, 0, 0, 0.35); --scrim: rgba(0, 4, 18, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--t-md); line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.2; letter-spacing: -0.015em; }
p { margin: 0; }
a { color: var(--accent); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Shell */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side); color: var(--side-ink);
  display: flex; flex-direction: column; gap: 18px; padding: 16px 12px calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(12px, env(safe-area-inset-left, 0px));
}
.logo { display: flex; align-items: center; gap: 10px; padding: 2px 6px; text-decoration: none; }
.logo-mark { width: 34px; height: 34px; flex: none; }
.logo-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.logo-word { display: block; width: 112px; height: auto; }
.logo-product { font-size: var(--t-2xs); text-transform: uppercase; letter-spacing: 0.14em; color: var(--side-muted); font-weight: 700; line-height: 1; }
.tagline { font-family: var(--f-display); font-weight: 600; font-size: var(--t-sm); letter-spacing: -0.01em; background: var(--brand-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 6px; }
.workspace { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--side-2); }
.workspace .ws-mark { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; background: var(--rc-cloud); color: var(--rc-midnight); font-weight: 800; font-size: var(--t-xs); flex: none; }
.workspace b { display: block; color: var(--side-active); font-size: var(--t-sm); font-weight: 600; line-height: 1.2; }
.workspace small { color: var(--side-muted); font-size: var(--t-2xs); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: var(--t-2xs); text-transform: uppercase; letter-spacing: 0.1em; color: var(--side-muted); font-weight: 700; padding: 10px 10px 4px; }
.nav a {
  position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r-sm); color: var(--side-ink);
  text-decoration: none; font-weight: 600; font-size: var(--t-md);
}
.nav a svg { flex: none; opacity: 0.8; }
.nav a:hover { background: var(--side-2); color: var(--side-active); }
.nav a[aria-current="page"] { background: var(--side-2); color: var(--side-active); }
.nav a[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 3px; border-radius: 3px; background: linear-gradient(180deg, #3653fd, #fd328e 60%, #fe812b); }
.nav a .badge { margin-left: auto; font-family: var(--f-mono); font-size: var(--t-2xs); padding: 1px 6px; border-radius: 10px; background: rgba(255, 255, 255, 0.08); color: var(--side-ink); }
.nav a .badge.crit { background: #d92d20; color: #fff; }
.side-foot { margin-top: auto; font-size: var(--t-2xs); color: var(--side-muted); padding: 0 10px; line-height: 1.5; }
.side-foot b { color: var(--side-ink); font-weight: 600; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
  padding-block: 10px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.btn.menu-btn { display: none; }
.cycle-btn { display: flex; align-items: center; gap: 10px; background: none; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 5px 10px; text-align: left; }
.cycle-btn:hover { border-color: var(--line-strong); }
.cycle-btn b { font-family: var(--f-mono); font-size: var(--t-sm); font-weight: 600; }
.cycle-btn span { font-size: var(--t-sm); color: var(--muted); }
.status-chip { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-xs); font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.status-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status-chip.blocked { background: var(--crit-soft); color: var(--crit); }
.status-chip.ready { background: var(--ok-soft); color: var(--ok); }
.status-chip.released { background: var(--info-soft); color: var(--info); }
.status-chip.nodata { background: var(--surface-2); color: var(--muted); }
.top-spacer { flex: 1; }
.last-run { font-size: var(--t-xs); color: var(--muted); white-space: nowrap; }
.popover { position: absolute; z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; min-width: 280px; }
.popover button { display: flex; flex-direction: column; align-items: flex-start; width: 100%; background: none; border: 0; padding: 8px 10px; border-radius: var(--r-sm); text-align: left; gap: 1px; }
.popover button:hover { background: var(--surface-2); }
.popover button small { color: var(--muted); font-size: var(--t-xs); }
.popover hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

.page { width: 100%; max-width: 1440px; padding-block: 22px 72px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 16px; margin-bottom: 18px; }
.page-head h1 { font-size: var(--t-2xl); font-weight: 800; letter-spacing: -0.01em; }
.page-head p { color: var(--muted); font-size: var(--t-sm); max-width: 80ch; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Buttons & controls */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); border-radius: var(--r-sm); padding: 7px 14px; font-weight: 600;
  font-size: var(--t-sm); text-decoration: none; white-space: nowrap; transition: background 0.15s, border-color 0.15s;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); background: var(--accent); }
.btn.danger { color: var(--crit); }
.btn.small { padding: 4px 10px; font-size: var(--t-xs); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; font-size: inherit; }
.seg { display: inline-flex; max-width: 100%; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow-x: auto; background: var(--surface); scrollbar-width: none; }
.seg button { white-space: nowrap; border: 0; background: none; padding: 6px 12px; font-size: var(--t-sm); font-weight: 600; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); }
.seg button .n { font-family: var(--f-mono); font-size: var(--t-xs); }
.field { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-sm); color: var(--muted); }
select, input.text, textarea.text {
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-sm); padding: 6px 10px; font-size: var(--t-sm); min-width: 0;
}
input.text { width: 240px; max-width: 100%; }
textarea.text { width: 100%; min-height: 72px; resize: vertical; line-height: 1.4; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 999px; padding: 3px 10px; font-size: var(--t-xs); font-weight: 700; }
.chip span { font-size: 1rem; line-height: 1; }

/* ---------- Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: var(--t-xs); font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; letter-spacing: 0.01em; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.blocker { background: var(--crit-soft); color: var(--crit); }
.pill.review { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.pass { background: var(--ok-soft); color: var(--ok); }
.pill.plain { background: var(--surface-2); color: var(--ink-2); }
.pill.plain::before { display: none; }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-xs); font-weight: 600; white-space: nowrap; }
.st i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; }
.st.open { color: var(--ink-2); }
.st.review { color: var(--warn); }
.st.review i { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.st.resolved { color: var(--ok); }
.st.resolved i { background: currentColor; }
.st.accepted { color: var(--info); }
.st.accepted i { background: currentColor; border-radius: 3px; }

/* ---------- Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 14px 16px 10px; }
.card-head h3 { font-size: var(--t-lg); font-weight: 750; }
.card-head .more { margin-left: auto; font-size: var(--t-sm); }
.card-body { padding: 0 16px 16px; }
.grid { display: grid; gap: 16px; }
.grid.ov-top { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.grid.ov-bottom { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }

/* Readiness */
.ready-card { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.ready-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ready-top h2 { font-size: var(--t-3xl); font-weight: 800; letter-spacing: -0.01em; }
.ready-card[data-state="blocked"] .ready-top h2 { color: var(--crit); }
.ready-card[data-state="ready"] .ready-top h2 { color: var(--ok); }
.ready-card[data-state="released"] .ready-top h2 { color: var(--info); }
.ready-card p { color: var(--ink-2); max-width: 62ch; }
.progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--brand-gradient); border-radius: 99px; transition: width 0.3s ease; }
.progress-meta { display: flex; justify-content: space-between; font-size: var(--t-xs); color: var(--muted); }
.owner-row { display: flex; flex-wrap: wrap; gap: 8px; }
.owner-row button { background: var(--surface-2); border: 0; border-radius: 999px; padding: 4px 10px; font-size: var(--t-xs); font-weight: 600; display: inline-flex; gap: 6px; }
.owner-row button b { color: var(--crit); font-family: var(--f-mono); }
.mini-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
.mini-list li + li { border-top: 1px solid var(--line); }
.mini-list button { width: 100%; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: none; border: 0; padding: 8px 10px; text-align: left; font-size: var(--t-sm); }
.mini-list button:hover { background: var(--surface-2); }
.mini-list .pill { justify-self: start; }
.mini-list .t { min-width: 0; }
.mini-list .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-list .t span { display: block; color: var(--muted); font-size: var(--t-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; padding: 4px 16px 16px; }
.facts div span { display: block; font-size: var(--t-xs); color: var(--muted); }
.facts div b { font-family: var(--f-display); font-size: var(--t-xl); font-weight: 700; font-variant-numeric: tabular-nums; }
.timeline { list-style: none; margin: 0; padding: 0 16px 16px; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 6px 0; font-size: var(--t-sm); position: relative; }
.timeline li::before { content: ""; position: absolute; left: 7px; top: 18px; bottom: -6px; width: 2px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.timeline .tdot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--surface); margin-top: 2px; z-index: 1; }
.timeline li.done .tdot { background: var(--ok); border-color: var(--ok); }
.timeline li.now .tdot { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.timeline li.fail .tdot { background: var(--crit); border-color: var(--crit); }
.timeline .tdate { color: var(--muted); font-size: var(--t-xs); font-family: var(--f-mono); }

.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { background: var(--surface); border: 0; text-align: left; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi:hover { background: var(--surface-2); }
.kpi .label { font-size: var(--t-2xs); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; }
.kpi .value { font-family: var(--f-display); font-weight: 700; font-size: var(--t-xl); font-variant-numeric: tabular-nums; line-height: 1.25; }
.kpi .value.zero { color: var(--muted); }
.kpi .sub { font-size: var(--t-2xs); color: var(--muted); }
.kpi[data-kind="underpaid"] .value:not(.zero), .kpi[data-kind="tax"] .value:not(.zero) { color: var(--crit); }

/* Pipeline (compact) */
.stages { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; }
.stage { position: relative; background: none; border: 0; border-left: 1px solid var(--line); padding: 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stage:first-child { border-left: 0; }
.stage:hover { background: var(--surface-2); }
.stage .ph { font-size: var(--t-2xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.stage .nm { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.stage .dotc { width: 10px; height: 10px; border-radius: 50%; background: var(--line-strong); flex: none; }
.stage[data-state="fail"] .dotc { background: var(--crit); }
.stage[data-state="warn"] .dotc { background: var(--warn); }
.stage[data-state="pass"] .dotc { background: var(--ok); }
.stage .ct { font-size: var(--t-xs); color: var(--muted); }
.stage .ct b.c { color: var(--crit); }
.stage .ct b.w { color: var(--warn); }
.stage .bar { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.stage .bar i { display: block; height: 100%; background: var(--ok); }
.stage[data-running="true"] .dotc { animation: pulse 0.7s ease-in-out infinite; background: var(--accent); }
@keyframes pulse { 50% { transform: scale(1.5); } }

.feed { list-style: none; margin: 0; padding: 0 16px 12px; }
.feed li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: var(--t-sm); }
.feed li:first-child { border-top: 0; }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: var(--t-2xs); font-weight: 800; flex: none; }
.avatar.sys { background: var(--surface-2); color: var(--muted); }
.feed .when { color: var(--muted); font-size: var(--t-xs); }

/* ---------- Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.card .table-wrap { border: 0; border-top: 1px solid var(--line); border-radius: 0 0 var(--r) var(--r); }
table { border-collapse: collapse; width: 100%; font-size: var(--t-sm); }
th, td { padding: 9px 12px; text-align: left; border-top: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
thead th { border-top: 0; font-size: var(--t-2xs); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; background: var(--surface-2); position: sticky; top: 0; }
td.n, th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 260px; }
tbody tr:hover { background: var(--surface-2); }
tr.clickable { cursor: pointer; }
tr.sel, tr.sel:hover { background: var(--accent-soft); }
td .pos { color: var(--warn); }
td .neg { color: var(--crit); }
.who { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 1px; }
.who b { font-weight: 600; }
.who:hover b { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.who span { font-size: var(--t-xs); color: var(--muted); }
.cb { width: 16px; height: 16px; accent-color: var(--accent); }

/* ---------- Exceptions split view */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 12px; }
.spacer { flex: 1; }
.bulk { display: flex; gap: 8px; align-items: center; background: var(--accent-soft); color: var(--accent); border-radius: var(--r-sm); padding: 6px 10px; font-size: var(--t-sm); font-weight: 600; flex-wrap: wrap; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 16px; align-items: start; }
.split.nodetail { grid-template-columns: minmax(0, 1fr); }
.qlist { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.qrow { display: grid; grid-template-columns: 22px 78px minmax(0, 1fr) 118px 96px 100px; gap: 4px 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer; }
.qrow:first-child { border-top: 0; }
.qrow:hover { background: var(--surface-2); }
.qrow.sel { background: var(--accent-soft); }
.qrow.closed .qt b { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.qhead { display: grid; grid-template-columns: 22px 78px minmax(0, 1fr) 118px 96px 100px; gap: 12px; padding: 8px 14px; background: var(--surface-2); font-size: var(--t-2xs); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; }
.qid { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.qid .mono { font-size: var(--t-2xs); color: var(--muted); }
.qt { min-width: 0; display: flex; flex-direction: column; gap: 2px; background: none; border: 0; padding: 0; text-align: left; }
.qt b { font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; overflow-wrap: anywhere; }
.qt span { font-size: var(--t-xs); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qimp { text-align: right; font-family: var(--f-mono); font-size: var(--t-sm); }
.qhead .qimp { font-family: inherit; font-size: inherit; }
.qimp small { display: block; white-space: nowrap; font-family: var(--f-body); font-size: var(--t-2xs); color: var(--muted); }
.qimp .k-underpaid, .qimp .k-tax { color: var(--crit); }
.qown { font-size: var(--t-xs); color: var(--ink-2); }
.detail { position: sticky; top: 72px; max-height: calc(100vh - 92px); overflow-y: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.detail-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.detail-head .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.detail-head h2 { font-size: var(--t-xl); font-weight: 750; }
.detail-body { padding: 14px 16px 18px; display: grid; gap: 16px; }
.detail-body h4 { font-family: var(--f-body); font-size: var(--t-2xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
.detail-body p { font-size: var(--t-sm); color: var(--ink-2); }
.ev { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
.ev div { background: var(--surface); padding: 8px 10px; }
.ev span { display: block; font-size: var(--t-2xs); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.ev b { font-weight: 600; font-size: var(--t-sm); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.actions-row { display: flex; gap: 8px; flex-wrap: wrap; }
.history { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.history li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; font-size: var(--t-sm); }
.history .when { color: var(--muted); font-size: var(--t-xs); }
.history .note { background: var(--surface-2); border-radius: var(--r-sm); padding: 6px 10px; margin-top: 4px; color: var(--ink); white-space: pre-wrap; }
.close-x { margin-left: auto; }
.form-err { color: var(--crit); font-size: var(--t-sm); margin-top: 6px; }
.ready-card .actions-row { margin-top: auto; padding-top: 4px; }
.ready-card .timeline { padding: 0; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }
.empty h3 { color: var(--ink); font-size: var(--t-lg); margin-bottom: 6px; }

/* ---------- Controls */
.check-stages { display: grid; gap: 16px; }
.check-stage { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.check-stage > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.check-stage > header h3 { font-size: var(--t-lg); font-weight: 750; }
.check-stage > header .sys { font-size: var(--t-sm); color: var(--muted); }
.check-stage > header .res { margin-left: auto; font-size: var(--t-sm); color: var(--ink-2); }
.check-stage ul { list-style: none; margin: 0; padding: 0; }
.check-row { width: 100%; display: grid; grid-template-columns: 26px 44px minmax(140px, 220px) minmax(0, 1fr) 112px; gap: 4px 12px; align-items: center; text-align: left; padding: 10px 16px; border: 0; border-top: 1px solid var(--line); background: none; }
.check-stage li:first-child .check-row { border-top: 0; }
.check-row:hover { background: var(--surface-2); }
.check-row .id { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--muted); }
.check-row .t { font-weight: 600; }
.check-row .rule { color: var(--ink-2); font-size: var(--t-sm); }
.check-row .res { text-align: right; font-size: var(--t-sm); }
.glyph { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; }
.glyph.pass { background: var(--ok-soft); color: var(--ok); }
.glyph.fail { background: var(--crit); color: var(--surface); }
.glyph.warn { background: var(--warn-soft); color: var(--warn); }
.glyph.note { background: var(--info-soft); color: var(--info); }
.glyph.idle { border: 1.5px dashed var(--line-strong); color: var(--muted); }

/* ---------- Sources */
.group-title { margin: 24px 0 10px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.group-title h3 { font-size: var(--t-lg); font-weight: 750; }
.sources { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
.source { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.source header { display: flex; gap: 10px; align-items: flex-start; }
.src-icon { width: 34px; height: 34px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-2); flex: none; }
.source h4 { font-family: var(--f-body); font-size: var(--t-md); font-weight: 700; }
.source .sys { font-size: var(--t-xs); color: var(--muted); }
.source .desc { font-size: var(--t-sm); color: var(--ink-2); }
.source .status { display: flex; align-items: center; gap: 8px; font-size: var(--t-sm); flex-wrap: wrap; }
.conn { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: var(--t-xs); }
.conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.conn.ok { color: var(--ok); }
.conn.bad { color: var(--crit); }
.conn.idle { color: var(--muted); }
.source .err { font-size: var(--t-sm); color: var(--crit); background: var(--crit-soft); padding: 8px 10px; border-radius: var(--r-sm); }
.source .api { font-family: var(--f-mono); font-size: var(--t-xs); background: var(--surface-2); padding: 8px 10px; border-radius: var(--r-sm); overflow-wrap: anywhere; color: var(--ink-2); }
.source .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.source details { font-size: var(--t-xs); color: var(--muted); }
.source details summary { cursor: pointer; }
.source details code { font-family: var(--f-mono); overflow-wrap: anywhere; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.pdf-preview table { font-size: var(--t-xs); }
.pdf-preview td, .pdf-preview th { padding: 5px 8px; }
.notice { display: flex; gap: 10px; align-items: flex-start; background: var(--info-soft); color: var(--ink); border-radius: var(--r-sm); padding: 10px 12px; font-size: var(--t-sm); }
.notice.warn { background: var(--warn-soft); }

/* ---------- The checks: data quality, pay accuracy, review, bank and ledger, repeat issues */
.appchip { display: inline-flex; align-items: center; gap: 5px; font-size: var(--t-2xs); font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.flow-card { overflow: hidden; }
.steps { list-style: none; margin: 0; padding: 4px 16px 14px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.steps li { position: relative; min-width: 0; }
.steps li + li::before { content: ""; position: absolute; left: -9px; top: 21px; width: 8px; height: 2px; background: var(--line-strong); }
.step { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.step:hover { border-color: var(--line-strong); background: var(--surface-2); }
.step-top { display: flex; align-items: center; gap: 8px; }
.step-top b { font-family: var(--f-display); font-size: var(--t-md); }
.step-n { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font: 700 var(--t-2xs)/1 var(--f-body); background: var(--surface-2); color: var(--ink-2); flex: none; }
.step[data-state="pass"] .step-n { background: var(--ok-soft); color: var(--ok); }
.step[data-state="warn"] .step-n { background: var(--warn-soft); color: var(--warn); }
.step[data-state="fail"] .step-n { background: var(--crit-soft); color: var(--crit); }
.step-q { font-size: var(--t-xs); color: var(--muted); }
.step-live { margin-top: auto; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-size: var(--t-xs); color: var(--ink-2); }
.guardrails { display: flex; flex-wrap: wrap; gap: 6px 8px; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
.guardrails span { font-size: var(--t-xs); font-weight: 700; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 3px 10px; }
.guardrails span::before { content: "✓ "; color: var(--ok); }
.sc-list { list-style: none; margin: 0; padding: 0 16px 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; }
.sc-list button { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; text-align: left; font-size: var(--t-sm); }
.sc-list button:hover { border-color: var(--line-strong); background: var(--surface-2); }
.sc-list .sc-t { flex: 1; min-width: 0; }
.sc-list .sc-t small { display: block; font-size: var(--t-2xs); color: var(--muted); margin-top: 1px; }
.vv { border: 1px solid color-mix(in srgb, var(--brand) 35%, var(--line)); border-radius: var(--r); padding: 12px 14px; background: color-mix(in srgb, var(--brand-soft) 45%, var(--surface)); display: grid; gap: 8px; }
.vv-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.vv-head b { font-family: var(--f-display); }
.vv-unmask { font-size: var(--t-xs); }
.vv-source { font-size: var(--t-xs); color: var(--muted); }
.vv-summary { font-weight: 700; color: var(--ink) !important; }
.vv-text { color: var(--ink) !important; }
.clause { margin: 0; padding: 8px 12px; border-left: 3px solid var(--brand); background: var(--surface); border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: var(--t-sm); color: var(--ink-2); }
.clause b { color: var(--ink); }
.vv-next { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 8px; }
.vv-next div { background: var(--surface); border-radius: var(--r-sm); padding: 6px 10px; }
.vv-next span { display: block; font-size: var(--t-2xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
.vv-next b { font-size: var(--t-sm); font-weight: 600; }
.cite { display: inline-grid; place-items: center; min-width: 22px; height: 18px; padding: 0 4px; border-radius: 4px; border: 0; background: var(--brand); color: var(--brand-ink); font: 700 var(--t-2xs)/1 var(--f-mono); vertical-align: 1px; margin: 0 1px; }
.cite.static { flex: none; }
.evid { display: grid; gap: 6px; }
.evid-row { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; font-size: var(--t-sm); background: var(--surface); }
.evid-row.flash { animation: flash 1.2s ease; }
@keyframes flash { 0%, 40% { background: var(--brand-soft); border-color: var(--brand); } }
.evid-why { color: var(--ink-2); margin-top: 2px; }
.evid-fields { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; font-family: var(--f-mono); font-size: var(--t-2xs); color: var(--ink-2); }
.evid-fields i { font-style: normal; color: var(--muted); }
.ai-sees summary { cursor: pointer; font-size: var(--t-sm); font-weight: 600; color: var(--ink-2); }
.ai-sees pre { max-height: 280px; overflow: auto; background: var(--surface-2); border-radius: var(--r-sm); padding: 10px; font: var(--t-2xs)/1.5 var(--f-mono); white-space: pre-wrap; word-break: break-word; }
.alerts { display: grid; gap: 6px; }
.alert { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 12px; font-size: var(--t-sm); }
.ex-line { width: 100%; display: grid; grid-template-columns: 78px minmax(0, 1fr) auto 104px; gap: 4px 12px; align-items: center; text-align: left; padding: 10px 16px; border: 0; border-top: 1px solid var(--line); background: none; }
.check-stage li:first-child .ex-line { border-top: 0; }
.ex-line:hover { background: var(--surface-2); }
.ex-line .t { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.ex-line .t b { font-weight: 600; }
.ex-line .t span { font-size: var(--t-xs); color: var(--muted); }
.ex-line .pill { justify-self: start; }
.amt { text-align: right; font-size: var(--t-sm); white-space: nowrap; }
.amt small { display: block; font-family: var(--f-body); font-size: var(--t-2xs); color: var(--muted); }
.check-stage > header .id { font-size: var(--t-xs); color: var(--muted); }
.rr-kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tw-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.rr-list { list-style: none; margin: 0; padding: 0; }
.rr-row { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1.4fr) minmax(80px, 1fr) 110px 104px; gap: 4px 14px; align-items: center; text-align: left; padding: 9px 16px; border: 0; border-top: 1px solid var(--line); background: none; }
.rr-row:hover { background: var(--surface-2); }
.rr-row .rank { color: var(--muted); font-size: var(--t-sm); }
.rr-row .t { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.rr-row .t b { font-weight: 600; }
.rr-row .t span { font-size: var(--t-xs); color: var(--muted); }
.rr-bar { height: 8px; background: var(--surface-2); border-radius: 8px; overflow: hidden; }
.rr-bar i { display: block; height: 100%; border-radius: 8px; background: var(--info); }
.rr-bar i.k-underpaid { background: var(--crit); }
.rr-bar i.k-overpaid { background: var(--warn); }
.rr-bar i.k-tax { background: var(--rc-pink); }
.tw-table tr.sub td { padding-top: 4px; padding-bottom: 4px; font-size: var(--t-xs); border-top-style: dashed; }
.tw-table td small { font-size: var(--t-2xs); }
.clusters { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; }
.cluster { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px 16px; display: grid; gap: 10px; }
.cluster header { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.cluster h4 { font-size: var(--t-lg); font-weight: 700; }
.cluster header p { font-size: var(--t-xs); margin-top: 2px; }
.cluster footer { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 8px; }
.heat-row { display: flex; align-items: center; gap: 8px; }
.heat { display: inline-flex; gap: 4px; }
.heat i { width: 26px; height: 22px; border-radius: 5px; background: var(--surface-2); display: grid; place-items: center; font: 700 var(--t-2xs)/1 var(--f-mono); font-style: normal; color: var(--brand-ink); }
.heat i.h1 { background: color-mix(in srgb, var(--rc-orange) 70%, transparent); color: #3a1600; }
.heat i.h2 { background: var(--rc-pink); color: #fff; }
.heat i.cur { outline: 2px solid var(--brand); outline-offset: 1px; }
.rc span { display: block; font-size: var(--t-2xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
.rc p { font-size: var(--t-sm); color: var(--ink-2); }
.st.escalated { color: var(--warn); }
.st.escalated i { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.st.approved { color: var(--ok); }
.st.approved i { background: currentColor; }
.st.dismissed { color: var(--info); }
.st.dismissed i { background: currentColor; border-radius: 3px; }
@media (max-width: 980px) {
  .steps { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .steps li + li::before { display: none; }
  .rr-row { grid-template-columns: 26px minmax(0, 1fr) 96px; }
  .rr-row .rr-bar, .rr-row .st { display: none; }
  .ex-line { grid-template-columns: 70px minmax(0, 1fr) auto; }
  .ex-line .st { display: none; }
  .sc-list { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .steps { grid-template-columns: minmax(0, 1fr); }
  .rr-kpis, .tw-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ex-line { grid-template-columns: minmax(0, 1fr) auto; }
  .ex-line .pill:first-child { display: none; }
  .vv-next { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- Import */
.import-card { margin-bottom: 8px; overflow: hidden; }
.drop { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px 18px; align-items: center; margin: 12px; padding: 18px 20px; border: 2px dashed var(--line-strong); border-radius: var(--r); background: var(--surface-2); transition: border-color 0.15s, background 0.15s; }
body.dragging .drop { border-color: var(--brand); background: var(--brand-soft); }
.drop-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--brand-gradient); color: #fff; }
.drop h3 { font-size: var(--t-lg); font-weight: 700; margin-bottom: 4px; }
.drop p { font-size: var(--t-sm); max-width: 72ch; }
.import-table td { vertical-align: top; }
.import-table td.wrap { min-width: 180px; }
.import-table select { max-width: 210px; }
.import-foot { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--line); }
.map-table { max-height: 54vh; overflow: auto; }
.map-table td { vertical-align: top; }
.map-table select { width: 100%; min-width: 170px; }
.map-ex { font-size: var(--t-xs); max-width: 180px; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.modal.wide { width: min(780px, calc(100% - 32px)); }

.who-chip { display: inline-flex; align-items: center; font-size: var(--t-xs); font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }

/* ---------- Ask AI panel */

}

.modal { position: fixed; z-index: 61; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow-y: auto; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid var(--line); }

/* ---------- Sign-in */

}
.si-wrap { width: min(440px, 100%); display: grid; gap: 18px; }

.subtabs { width: 100%; max-width: 1440px; padding: 14px max(24px, env(safe-area-inset-right, 0px)) 0 24px; }
.subtab-row { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }

.qrow, .qhead { grid-template-columns: 22px 78px minmax(0, 1fr) 118px 96px 100px 30px; }

.qa { width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ok); border-radius: var(--r-sm); opacity: 0; transition: opacity 0.12s, background 0.12s; }

/* ---------- Release checklist */
.rel-check { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
