<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Payroll Assurance Pipeline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Validates one pay cycle from WFM time records through the payroll register, treasury funding and GL posting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: one pay cycle on one screen. Release stub and exposure up top, the five-stage
   pipeline as a transit line, then a work queue with tabs. Drawer for one person. */
:root {
  --bg: #f2f5f4;
  --surface: #ffffff;
  --surface-2: #eaf0ee;
  --ink: #13221f;
  --ink-2: #364844;
  --muted: #61726d;
  --line: #d5dfdb;
  --line-strong: #adbdb8;
  --accent: #0c6a61;
  --accent-ink: #ffffff;
  --accent-soft: #d9eeea;
  --crit: #b3261c;
  --crit-soft: #fbe5e2;
  --warn: #965800;
  --warn-soft: #fbefd6;
  --ok: #1b7841;
  --ok-soft: #dff1e5;
  --info: #3b5d8e;
  --info-soft: #e3eaf5;
  --hatch: rgba(19, 34, 31, 0.06);
  --shadow: 0 1px 2px rgba(19, 34, 31, 0.06), 0 8px 24px rgba(19, 34, 31, 0.06);

  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --t-xs: 0.75rem;
  --t-sm: 0.8125rem;
  --t-md: 0.875rem;
  --t-lg: 1rem;
  --t-xl: 1.25rem;
  --t-2xl: 1.625rem;
  --t-3xl: 2.125rem;
  --r: 10px;
  --r-sm: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1412; --surface: #141d1b; --surface-2: #1a2523; --ink: #e1eae7; --ink-2: #bac9c4; --muted: #8b9e98;
    --line: #26332f; --line-strong: #3b4c47; --accent: #4bb8a8; --accent-ink: #04201c; --accent-soft: #123430;
    --crit: #f27a6e; --crit-soft: #3a1613; --warn: #eeb259; --warn-soft: #33260d; --ok: #63c98a; --ok-soft: #112f1c;
    --info: #93b1e2; --info-soft: #182438; --hatch: rgba(225, 234, 231, 0.05);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1412; --surface: #141d1b; --surface-2: #1a2523; --ink: #e1eae7; --ink-2: #bac9c4; --muted: #8b9e98;
  --line: #26332f; --line-strong: #3b4c47; --accent: #4bb8a8; --accent-ink: #04201c; --accent-soft: #123430;
  --crit: #f27a6e; --crit-soft: #3a1613; --warn: #eeb259; --warn-soft: #33260d; --ok: #63c98a; --ok-soft: #112f1c;
  --info: #93b1e2; --info-soft: #182438; --hatch: rgba(225, 234, 231, 0.05);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--t-md);
  line-height: 1.5;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); font-stretch: 85%; margin: 0; text-wrap: balance; line-height: 1.15; }
p { margin: 0; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-feature-settings: "tnum" 1; }
.muted { color: var(--muted); }
.eyebrow { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Top bar */
.top { border-bottom: 1px solid var(--line); background: var(--surface); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-size: var(--t-xl); font-weight: 750; letter-spacing: -0.01em; }
.brand p { font-size: var(--t-sm); color: var(--muted); }
.cycle { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-left: auto; font-size: var(--t-sm); color: var(--ink-2); }
.cycle b { font-weight: 600; color: var(--ink); }
.cycle .tag { font-family: var(--f-mono); font-size: var(--t-xs); padding: 1px 6px; border: 1px solid var(--line-strong); border-radius: 4px; color: var(--muted); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  border-radius: var(--r-sm); padding: 7px 14px; font-weight: 600; font-size: var(--t-sm);
  transition: background 0.15s, border-color 0.15s;
}
a.btn { text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
.btn.small { padding: 4px 10px; font-size: var(--t-xs); }
.btn[disabled] { opacity: 0.55; cursor: default; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

/* ---------- Decision band */
.decision .wrap { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 20px; padding-block: 20px 8px; }
.stub {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 18px 26px 18px 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;
}
.stub::after {
  /* perforated edge, like a pay stub */
  content: ""; position: absolute; top: 8px; bottom: 8px; right: 7px; width: 6px;
  background: radial-gradient(circle, var(--bg) 2.4px, transparent 2.9px) center top / 6px 11px repeat-y;
}
.stub::before { content: ""; position: absolute; top: 10px; bottom: 10px; right: 16px; border-right: 1px dashed var(--line-strong); }
.stub-status { display: flex; align-items: center; gap: 10px; }
.stub-status h2 { font-size: var(--t-3xl); font-weight: 800; font-stretch: 80%; letter-spacing: -0.01em; }
.stub[data-decision="hold"] .stub-status h2 { color: var(--crit); }
.stub[data-decision="release-with-actions"] .stub-status h2 { color: var(--warn); }
.stub[data-decision="release"] .stub-status h2 { color: var(--ok); }
.stamp {
  font-family: var(--f-mono); font-size: var(--t-xs); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  border: 1.5px solid currentColor; border-radius: 4px; padding: 1px 6px; transform: rotate(-3deg);
}
.stub[data-decision="hold"] .stamp { color: var(--crit); }
.stub[data-decision="release-with-actions"] .stamp { color: var(--warn); }
.stub[data-decision="release"] .stamp { color: var(--ok); }
.stub p { color: var(--ink-2); max-width: 46ch; }
.stub-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--t-sm); color: var(--muted); padding-right: 12px; }
.stub-meta b { color: var(--ink); font-weight: 600; }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; align-self: start; }
.kpi { background: var(--surface); border: 0; text-align: left; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi:hover { background: var(--surface-2); }
.kpi[aria-pressed="true"] { background: var(--accent-soft); }
.kpi .label { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
.kpi .value { font-family: var(--f-display); font-stretch: 80%; font-weight: 700; font-size: var(--t-2xl); font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi .value.zero { color: var(--muted); }
.kpi .sub { font-size: var(--t-xs); color: var(--muted); }
.kpi[data-kind="underpaid"] .value:not(.zero), .kpi[data-kind="tax"] .value:not(.zero) { color: var(--crit); }

/* ---------- Pipeline */
.pipeline .wrap { padding-block: 18px 10px; }
.phases { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-bottom: 6px; }
.phases span { text-align: center; font-size: var(--t-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.pipe { position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.track { position: absolute; left: 10%; right: 10%; top: 21px; height: 3px; background: var(--line-strong); border-radius: 2px; }
.track i { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--accent); border-radius: 2px; transition: width 0.35s ease; }
.node {
  position: relative; background: none; border: 0; padding: 0 4px 8px; display: flex; flex-direction: column; align-items: center;
  text-align: center; gap: 6px; border-radius: var(--r); min-width: 0;
}
.node:hover .node-name { color: var(--accent); }
.node[aria-pressed="true"] .node-name { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.dot {
  width: 45px; height: 45px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface); border: 3px solid var(--line-strong); font-family: var(--f-display); font-stretch: 80%;
  font-weight: 800; font-size: var(--t-lg); position: relative; z-index: 1; transition: background 0.2s, border-color 0.2s, transform 0.2s;
}
.node[data-state="fail"] .dot { background: var(--crit); border-color: var(--crit); color: var(--surface); }
.node[data-state="warn"] .dot { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.node[data-state="pass"] .dot { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.node[data-state="idle"] .dot { color: var(--muted); border-style: dashed; }
.node[data-state="running"] .dot { border-color: var(--accent); color: var(--accent); animation: pulse 0.7s ease-in-out infinite; }
.node[data-state="queued"] .dot { color: transparent; }
@keyframes pulse { 50% { transform: scale(1.08); } }
.node .txt { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.node-name { font-family: var(--f-display); font-stretch: 88%; font-weight: 700; font-size: var(--t-lg); }
.node-sys { font-size: var(--t-xs); color: var(--muted); }
.node-counts { font-size: var(--t-xs); color: var(--ink-2); display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 8px; }
.node-counts .c-crit { color: var(--crit); font-weight: 700; }
.node-counts .c-warn { color: var(--warn); font-weight: 700; }

/* ---------- Tabs */
.tabs-bar { border-bottom: 1px solid var(--line); margin-top: 12px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px 9px; font-weight: 600; color: var(--muted);
  white-space: nowrap; font-size: var(--t-md);
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .count { font-family: var(--f-mono); font-size: var(--t-xs); margin-left: 6px; padding: 0 6px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); }
main .wrap { padding-block: 16px 64px; }
.panel[hidden] { display: none !important; }

/* ---------- Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: var(--t-xs); font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; letter-spacing: 0.02em; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.blocker { background: var(--crit-soft); color: var(--crit); }
.pill.review { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.pass { background: var(--ok-soft); color: var(--ok); }
.pill.plain { background: var(--surface-2); color: var(--ink-2); }
.pill.plain::before { display: none; }

/* ---------- Filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
.seg button { white-space: nowrap; border: 0; background: none; padding: 6px 12px; font-size: var(--t-sm); font-weight: 600; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); }
.seg button .n { font-family: var(--f-mono); font-size: var(--t-xs); }
.seg button[data-sev="blocker"][aria-pressed="true"] .n { color: var(--crit); }
.seg button[data-sev="review"][aria-pressed="true"] .n { color: var(--warn); }
.seg button[data-sev="info"][aria-pressed="true"] .n { color: var(--info); }
.field { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-sm); color: var(--muted); }
.field select, .field input, input.text {
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-sm); padding: 6px 10px; font-size: var(--t-sm); min-width: 0;
}
input.text { width: 220px; max-width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 999px; padding: 3px 10px; font-size: var(--t-xs); font-weight: 700; }
.chip span { font-size: 1rem; line-height: 1; }
.spacer { flex: 1; }

/* ---------- Exceptions */
.ex-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.ex { display: grid; grid-template-columns: 128px minmax(0, 1fr) 190px 128px; gap: 6px 18px; padding: 14px 16px; border-top: 1px solid var(--line); align-items: start; }
.ex:first-child { border-top: 0; }
.ex-sev { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.ex-check { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--muted); }
.ex-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ex-main h4 { font-family: var(--f-body); font-stretch: 100%; font-size: var(--t-md); font-weight: 700; }
.ex-main .detail { color: var(--ink-2); font-size: var(--t-sm); max-width: 78ch; }
.ex-action { font-size: var(--t-sm); color: var(--ink); max-width: 78ch; display: flex; gap: 8px; align-items: baseline; }
.ex-action .owner { flex: none; font-size: var(--t-xs); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); }
.ex-who { min-width: 0; }
.who { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 1px; }
.who b { font-weight: 600; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.who:hover b { text-decoration-color: var(--accent); color: var(--accent); }
.who span { font-size: var(--t-xs); color: var(--muted); }
.ex-impact { text-align: right; display: flex; flex-direction: column; gap: 1px; }
.ex-impact b { font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.ex-impact span { font-size: var(--t-xs); color: var(--muted); }
.ex-impact .k-underpaid, .ex-impact .k-tax { color: var(--crit); }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }

/* ---------- Checks */
.check-stages { display: grid; gap: 16px; }
.check-stage { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.check-stage > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.check-stage > header h3 { font-size: var(--t-xl); font-weight: 750; }
.check-stage > header .sys { font-size: var(--t-sm); color: var(--muted); }
.check-stage > header .res { margin-left: auto; font-size: var(--t-sm); color: var(--ink-2); }
.check-row { width: 100%; display: grid; grid-template-columns: 26px 44px minmax(140px, 220px) minmax(0, 1fr) 112px; gap: 4px 12px; align-items: center; text-align: left; padding: 10px 16px; border: 0; border-top: 1px solid var(--line); background: none; }
.check-stage li:first-child .check-row { border-top: 0; }
.check-row:hover { background: var(--surface-2); }
.check-row .id { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--muted); }
.check-row .t { font-weight: 600; }
.check-row .rule { color: var(--ink-2); font-size: var(--t-sm); }
.check-row .res { text-align: right; font-size: var(--t-sm); }
.check-stage ul { list-style: none; margin: 0; padding: 0; }
.glyph { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; font-family: var(--f-mono); }
.glyph.pass { background: var(--ok-soft); color: var(--ok); }
.glyph.fail { background: var(--crit); color: var(--surface); }
.glyph.warn { background: var(--warn-soft); color: var(--warn); }
.glyph.note { background: var(--info-soft); color: var(--info); }
.glyph.idle { border: 1.5px dashed var(--line-strong); color: var(--muted); }

/* ---------- Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: var(--t-sm); }
th, td { padding: 9px 12px; text-align: left; border-top: 1px solid var(--line); white-space: nowrap; }
thead th { border-top: 0; font-size: var(--t-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
td.n, th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
tbody tr:hover { background: var(--surface-2); }
td .pos { color: var(--warn); }
td .neg { color: var(--crit); }
.people-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: var(--t-sm); }

/* ---------- Intake */
.intro { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; margin-bottom: 18px; }
.intro p { max-width: 72ch; color: var(--ink-2); }
.group-title { margin: 22px 0 10px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.group-title h3 { font-size: var(--t-xl); font-weight: 750; }
.sources { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
.source { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.source header { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
.source h4 { font-family: var(--f-body); font-stretch: 100%; font-size: var(--t-lg); font-weight: 700; }
.source .sys { font-size: var(--t-xs); color: var(--muted); }
.source .desc { font-size: var(--t-sm); color: var(--ink-2); }
.source .status { display: flex; align-items: center; gap: 8px; font-size: var(--t-sm); flex-wrap: wrap; }
.source .status .ok { color: var(--ok); font-weight: 700; }
.source .status .bad { color: var(--crit); font-weight: 700; }
.source .err { font-size: var(--t-sm); color: var(--crit); background: var(--crit-soft); padding: 8px 10px; border-radius: var(--r-sm); }
.source .api { font-family: var(--f-mono); font-size: var(--t-xs); background: var(--surface-2); padding: 8px 10px; border-radius: var(--r-sm); overflow-wrap: anywhere; color: var(--ink-2); }
.source .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.source details { font-size: var(--t-xs); color: var(--muted); }
.source details summary { cursor: pointer; }
.source details code { font-family: var(--f-mono); overflow-wrap: anywhere; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.pdf-preview { font-size: var(--t-xs); }
.pdf-preview table { font-size: var(--t-xs); }
.pdf-preview td, .pdf-preview th { padding: 5px 8px; }

/* ---------- Rules */
.rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 12px; }
.rule-card { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.rule-card h4 { font-family: var(--f-body); font-stretch: 100%; font-size: var(--t-lg); font-weight: 700; }
.rule-card .src { font-size: var(--t-xs); color: var(--muted); }
.rule { display: grid; grid-template-columns: minmax(0, 1fr) 112px; gap: 4px 12px; align-items: center; }
.rule label { font-size: var(--t-sm); }
.rule .hint { grid-column: 1 / -1; font-size: var(--t-xs); color: var(--muted); margin-top: -2px; }
.rule .hint.changed { color: var(--accent); font-weight: 600; }
.rule input, .rule select { width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-sm); padding: 5px 8px; font-family: var(--f-mono); font-size: var(--t-sm); text-align: right; }
.rule select { text-align: left; font-family: var(--f-body); }
.rule input[type="checkbox"] { width: 18px; height: 18px; justify-self: end; }
.rule-wide { grid-column: 1 / -1; }

/* ---------- Brief */
.brief { max-width: 820px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; }
.brief .memo-head { display: grid; gap: 2px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.brief .memo-head h3 { font-size: var(--t-2xl); font-weight: 800; }
.brief h4 { font-family: var(--f-body); font-stretch: 100%; font-size: var(--t-sm); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-top: 6px; }
.brief h5 { font-size: var(--t-md); margin: 8px 0 4px; font-family: var(--f-body); }
.brief ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.brief li { max-width: 72ch; }
.brief .lead { font-size: var(--t-lg); max-width: 64ch; }
.brief-tools { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
textarea.copy-fallback { width: 100%; min-height: 160px; font-family: var(--f-mono); font-size: var(--t-xs); border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface); padding: 8px; }

/* ---------- Drawer */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 13, 0.38); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100%); background: var(--bg); z-index: 41;
  border-left: 1px solid var(--line); box-shadow: var(--shadow); overflow-y: auto; overscroll-behavior: contain;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer-head { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); padding: 16px 20px; display: flex; gap: 12px; align-items: flex-start; }
.drawer-head h3 { font-size: var(--t-2xl); font-weight: 800; }
.drawer-head .meta { font-size: var(--t-sm); color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 4px; }
.drawer-head .close { margin-left: auto; flex: none; }
.drawer-body { padding: 16px 20px 40px; display: grid; gap: 22px; }
.drawer section h4 { font-family: var(--f-body); font-stretch: 100%; font-size: var(--t-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
.mini-ex { display: grid; gap: 8px; }
.mini-ex div { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 10px 12px; display: grid; gap: 4px; }
.mini-ex .h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 700; }
.mini-ex p { font-size: var(--t-sm); color: var(--ink-2); }
.timecard td, .timecard th { padding: 7px 10px; vertical-align: top; }
.timecard td.day { font-weight: 600; }
.timecard td.p { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--ink-2); }
.timecard td.h { font-family: var(--f-mono); font-weight: 600; text-align: right; }
.timecard tr.out td { background: repeating-linear-gradient(135deg, var(--hatch) 0 6px, transparent 6px 12px); color: var(--muted); }
.timecard tr.flagged td { background: var(--crit-soft); }
.timecard tr.warned td { background: var(--warn-soft); }
.timecard tr.week td { background: var(--surface-2); font-weight: 700; border-top: 1px solid var(--line-strong); }
.timecard td.tags { white-space: normal; min-width: 120px; }
.tag-s { display: inline-block; font-size: 0.6875rem; font-weight: 700; padding: 0 5px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); }
.tag-s.crit { background: var(--crit); color: var(--surface); }
.tag-s.warn { background: var(--warn); color: var(--surface); }
.tag-s.pto { background: var(--info-soft); color: var(--info); }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 16px; font-size: var(--t-sm); }
.kv div span { display: block; font-size: var(--t-xs); color: var(--muted); }

/* ---------- Toast */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: var(--t-sm); font-weight: 600;
  box-shadow: var(--shadow); max-width: calc(100% - 32px);
}

footer .wrap { padding-block: 0 40px; font-size: var(--t-xs); color: var(--muted); }

/* ---------- Responsive */
@media (max-width: 980px) {
  .decision .wrap { grid-template-columns: 1fr; }
  .ex { grid-template-columns: 112px minmax(0, 1fr); }
  .ex-who { grid-column: 2; }
  .ex-impact { grid-column: 2; text-align: left; flex-direction: row; gap: 8px; align-items: baseline; }
  .check-row { grid-template-columns: 26px 40px minmax(0, 1fr) auto; }
  .check-row .rule { grid-column: 3 / -1; }
}
@media (max-width: 640px) {
  .cycle { margin-left: 0; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .phases { display: none; }
  .pipe { grid-template-columns: 1fr; gap: 0; }
  .track { left: 21px; right: auto; top: 22px; bottom: 22px; width: 3px; height: auto; }
  .track i { width: 100% !important; height: var(--fill, 100%); transition: height 0.35s ease; }
  .node { flex-direction: row; align-items: center; text-align: left; padding: 6px 0; gap: 12px; }
  .node .txt { align-items: flex-start; }
  .node-counts { justify-content: flex-start; }
  .ex { grid-template-columns: 1fr; padding: 14px; }
  .ex-sev { flex-direction: row; align-items: center; }
  .ex-who, .ex-impact { grid-column: 1; }
  .check-row { grid-template-columns: 26px minmax(0, 1fr) auto; }
  .check-row .id { display: none; }
  .check-row .rule { grid-column: 2 / -1; }
  .brief { padding: 18px; }
  .stub-status h2 { font-size: var(--t-2xl); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
